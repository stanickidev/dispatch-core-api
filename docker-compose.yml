services:
  db:
    image: postgres:17-alpine
    container_name: dispatch-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-dispatch-core}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: '512mb'
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_NAME:-dispatch-core}", "-U", "${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
    name: dispatch-postgres-data